# ─────────────────────────────────────────────────────────────
#  ML Fin-Advisor — Docker Compose
# ─────────────────────────────────────────────────────────────
services:
  # ── Inference API ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.serve
    image: fin-advisor-api:latest
    container_name: fin-advisor-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-60}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,testserver}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - SECURITY_HSTS_ENABLED=${SECURITY_HSTS_ENABLED:-false}
      # STEP 12: user-owned persistence (server-side only; host supplies the
      # real DSN — never committed). Empty value = persistence disabled.
      - DATABASE_URL=${DATABASE_URL:-}
      - DATABASE_CONNECT_TIMEOUT=${DATABASE_CONNECT_TIMEOUT:-5}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  # ── Redis cache (optional — API falls back to in-memory) ──
  redis:
    image: redis:7-alpine
    container_name: fin-advisor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  redis-data:
