name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt holds the Streamlit demo's deps (streamlit, plotly,
          # pillow) and lacks pydantic/sklearn/lightgbm, so collection fails on it.
          # requirements-serve.txt is the actual serving-layer dependency set.
          pip install -r requirements-serve.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          python -m pytest -q tests/unit
